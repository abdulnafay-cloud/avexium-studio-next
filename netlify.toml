[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  CIRCLE_NODE_TOTAL = "2"
  NODE_OPTIONS = "--max-old-space-size=1536 --max-semi-space-size=8"

# Netlify automatically installs its current Next.js/OpenNext adapter.
# Database and authentication secrets belong in Netlify environment variables,
# never in this file or the repository.
